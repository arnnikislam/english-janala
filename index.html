<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- connect with fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <!-- fontawesome integration -->
    <script
      src="https://kit.fontawesome.com/43ad48246d.js"
      crossorigin="anonymous"
    ></script>
    <!-- tailwind css and daisy ui connection -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- link with css -->
    <link rel="stylesheet" href="./styles/style.css" />
    <title>English Janala</title>
  </head>
  <body class="container mx-auto">
    <!-- header -->
    <header>
      <!-- navbar -->
      <nav>
        <div class="navbar bg-[rgba(186,222,255,0.26)] shadow-sm px-4">
          <div class="navbar-start">
            <div class="dropdown">
              <div tabindex="0" role="button" class="btn btn-ghost lg:hidden">
                <svg
                  aria-label="Menu"
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-5 w-5"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M4 6h16M4 12h8m-8 6h16"
                  />
                </svg>
              </div>
              <ul
                tabindex="-1"
                class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow space-y-1"
              >
                <li>
                  <button class="">
                    <i class="fa-solid fa-circle-question"></i> FAQ
                  </button>
                </li>
                <li>
                  <button class="">
                    <i class="fa-solid fa-book-open"></i> Learn
                  </button>
                </li>
                <li>
                  <button class="">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> LogOut
                  </button>
                </li>
              </ul>
            </div>
            <div class="flex items-center gap-1">
              <span>English</span
              ><img src="./assets/logo.png" alt="" srcset="" /><span
                class="bangla-font"
                >জানালা</span
              >
            </div>
          </div>
          <div class="navbar-end hidden lg:flex">
            <ul class="menu menu-horizontal px-1 space-x-2">
              <li>
                <button class="btn btn-outline btn-primary">
                  <i class="fa-solid fa-circle-question"></i> FAQ
                </button>
              </li>
              <li>
                <button class="btn btn-outline btn-primary">
                  <i class="fa-solid fa-book-open"></i> Learn
                </button>
              </li>
              <li>
                <button class="btn btn-outline btn-primary">
                  <i class="fa-solid fa-arrow-right-from-bracket"></i> LogOut
                </button>
              </li>
            </ul>
          </div>
        </div>
      </nav>

      <!-- hero section -->
      <section class="py-4">
        <div
          class="hero-container flex flex-col-reverse md:flex-row justify-between items-center gap-8 w-11/12 m-auto"
        >
          <div class="content flex-1 space-y-4">
            <h1 class="font-bold text-2xl text-center md:text-left md:text-4xl">
              <span class="text-[#00BCFF]">English</span> is Easy!!
            </h1>
            <p class="bangla-font text-sm md:text-xl">
              আজ থেকেই আপনার ভাষা শেখার যাত্রা শুরু করুন। আপনি যদি নতুন হন অথবা
              আপনার দক্ষতা বাড়াতে চান, আমাদের Interactive Lessons আপনাকে নিয়ে
              যাবে অন্য একটি Level এ
            </p>
            <div class="login space-y-3">
              <fieldset class="fieldset">
                <input type="text" id="name" class="input" placeholder="Name" />
              </fieldset>
              <fieldset class="fieldset">
                <input
                  type="password"
                  id="password"
                  class="input"
                  placeholder=".........................."
                />
              </fieldset>
              <button class="btn btn-primary">Get Started</button>
            </div>
          </div>
          <div class="img flex-1">
            <img src="./assets/hero-student.png" alt="" />
          </div>
        </div>
      </section>
    </header>

    <!-- main -->
    <main>
      <!-- vocab section -->
      <section class="text-center py-3">
        <h2 class="font-bold text-xl md:text-3xl">
          <span class="text-[#00BCFF]">Let's</span> Learn Vocabularies
        </h2>
        <div
          class="lessonsContainer my-4 flex justify-center flex-wrap gap-3 w-11/12 md:w-3/4 mx-auto"
        >
          <!-- button data will load here -->
        </div>
      </section>

      <!-- search word features -->
      <section class="py-4 flex justify-center items-center">
        <div class="join">
          <div>
            <label class="input validator join-item">
              <input
                id="input-text"
                type="text"
                placeholder="Search word"
                required
              />
            </label>
            <div class="validator-hint hidden">Enter valid word</div>
          </div>
          <button class="btn btn-neutral join-item" id="search-btn">
            Search
          </button>
        </div>
      </section>

      <!-- spinner -->
      <section class="flex justify-center items-center">
        <span
          class="loading loading-spinner loading-xl hidden my-10"
          id="spinner"
        ></span>
      </section>

      <!-- word card showing here -->
      <section
        id="word-container"
        class="bg-[#F8F8F8] py-10 w-11/12 mb-16 px-4 mx-auto rounded-md grid grid-cols-1 md:grid-cols-3 gap-7"
      >
        <!-- remainder to select lessons -->
        <div
          class="warning bg-[#F8F8F8] py-10 w-11/12 text-center my-4 mx-auto rounded-md space-y-2 col-span-full"
        >
          <p class="bangla-font text-sm md:text-xl text-[#79716B]">
            আপনি এখনো কোন Lesson Select করেননি
          </p>
          <p
            class="bangla-font text-[#292524] font-semibold text-xl md:text-3xl"
          >
            একটি Lesson Select করুন।
          </p>
        </div>
      </section>

      <!-- Open the modal using ID.showModal() method -->
      <!-- <button class="btn" onclick="my_modal_5.showModal()">open modal</button> -->
      <dialog id="word_modal" class="modal modal-bottom sm:modal-middle">
        <div class="modal-box">
          <div class="space-y-3" id="details-container"></div>
          <div class="modal-action">
            <form method="dialog">
              <!-- if there is a button in form, it will close the modal -->
              <button class="btn">Close</button>
            </form>
          </div>
        </div>
      </dialog>
    </main>

    <!-- connect with js file -->
    <script src="./js/script.js"></script>
  </body>
</html>
